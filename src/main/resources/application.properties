spring.application.name=studio-many-scheduling-actions-service

# Server
server.port=8080

# H2 Database (persistente em arquivo - edicoes no banco sobrevivem a restart)
spring.datasource.url=jdbc:h2:file:./data/studiomany;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL init (schema.sql + data.sql rodam em todo boot - ambos idempotentes)
spring.sql.init.mode=always

# H2 Console (acesso: /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# WhatsApp - provedor de envio: waha | twilio 
whatsapp.provider=waha

# WAHA (WhatsApp HTTP API)
waha.api.url=http://localhost:3000
waha.api.apikey=${WAHA_API_KEY:}
waha.session=Teste
# Telefone placeholder (POC) - envio em formato internacional sem '+'
waha.phone.default=5511999999999

# Twilio (WhatsApp Business API) - usado quando whatsapp.provider=twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# API Key (opcional) - se preenchida, autentica como API Key + Secret + Account SID
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
# Numero de origem no formato whatsapp:+5511987654321
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}
